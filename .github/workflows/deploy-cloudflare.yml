name: 部署到 Cloudflare Workers

# 在 GitHub Actions 上完成构建，再把产物推送到 Cloudflare Workers。
# 这样环境变量（尤其 GATE_PASSWORD）统一由 GitHub Secrets 提供，
# 不依赖 Cloudflare 构建环境里的 "Build variables" 配置。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: 构建并部署
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.14.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GATE_PASSWORD 是必填项：securityConfig.enabled 为 true 时缺失会直接中断构建
      # （防止"以为加密了其实是明文"）。其余 PUBLIC_* 变量缺失只会让对应功能降级。
      - name: Build
        run: pnpm build
        env:
          GATE_PASSWORD: ${{ secrets.GATE_PASSWORD }}
          PUBLIC_AMAP_KEY: ${{ secrets.PUBLIC_AMAP_KEY }}
          PUBLIC_AMAP_KEY_PLACES: ${{ secrets.PUBLIC_AMAP_KEY_PLACES }}
          PUBLIC_UMAMI_BASE: ${{ secrets.PUBLIC_UMAMI_BASE }}
          PUBLIC_UMAMI_USERNAME: ${{ secrets.PUBLIC_UMAMI_USERNAME }}
          PUBLIC_UMAMI_PASSWORD: ${{ secrets.PUBLIC_UMAMI_PASSWORD }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_UMAMI_SHARE_ID: ${{ secrets.PUBLIC_UMAMI_SHARE_ID }}
          PUBLIC_WALINE_SERVER: ${{ secrets.PUBLIC_WALINE_SERVER }}
          PUBLIC_IMAGEBED_URL: ${{ secrets.PUBLIC_IMAGEBED_URL }}
          PUBLIC_IMAGEBED_AUTH_CODE: ${{ secrets.PUBLIC_IMAGEBED_AUTH_CODE }}
          PUBLIC_IMAGEBED_FOLDER: ${{ secrets.PUBLIC_IMAGEBED_FOLDER }}
          PUBLIC_IMAGEBED_API_TOKEN: ${{ secrets.PUBLIC_IMAGEBED_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm

      - name: 输出部署地址
        run: echo "部署完成：${{ steps.deploy.outputs.deployment-url }}"
